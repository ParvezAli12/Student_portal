<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Dashboard — SSUET Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/student-portal.css">
</head>
<body>

  <div class="mobile-topbar">
    <div class="mobile-logo">SSUET <span>Portal</span></div>
    <button class="hamburger" id="hamburger">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- SIDEBAR -->
  <div class="sidebar student-sidebar">
    <div class="logo">
      <div class="logo-box" style="background:#2D6A4F">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <div>
        <div class="logo-name">SSUET Portal</div>
        <div class="logo-sub">Student Panel</div>
      </div>
    </div>

    <div class="student-pill">
      <div class="s-avatar" id="sAvatar">—</div>
      <div>
        <div class="s-name" id="sName">—</div>
        <div class="s-roll" id="sRoll">—</div>
      </div>
    </div>

    <div class="nav-section">Menu</div>
    <a class="nav-item active" href="/pages/student-dashboard.html">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a class="nav-item" href="/pages/student-attendance.html">
      <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      Attendance
    </a>
    <a class="nav-item" href="/pages/student-marks.html">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/></svg>
      Marks
    </a>
    <a class="nav-item" href="/pages/student-result.html">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Result Card
    </a>
    <a class="nav-item" href="/pages/student-qr.html">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="5" height="5"/><rect x="16" y="3" width="5" height="5"/><rect x="3" y="16" width="5" height="5"/><path d="M21 16h-3v3M21 21h-3M16 16h.01"/></svg>
      My QR Code
    </a>
    <a class="nav-item" href="/pages/student-profile.html">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile & Password
    </a>

    <div class="sidebar-footer">
      <button class="logout-btn" id="logoutBtn">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Logout
      </button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="s-topbar">
      <div>
        <div class="page-title" id="welcomeTitle">Welcome back</div>
        <div class="page-sub"  id="todayDate"></div>
      </div>
      <a href="/pages/student-qr.html" class="qr-shortcut">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="5" height="5"/><rect x="16" y="3" width="5" height="5"/><rect x="3" y="16" width="5" height="5"/><path d="M21 16h-3v3M21 21h-3M16 16h.01"/></svg>
        My QR Code
      </a>
    </div>

    <!-- Warning banner if below 75% -->
    <div class="warning-banner" id="warningBanner" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span id="warningText">You have subjects with attendance below 75%</span>
    </div>

    <!-- Stats -->
    <div class="s-stats-grid">
      <div class="s-stat-card">
        <div class="s-stat-icon att-icon">
          <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </div>
        <div class="s-stat-val" id="avgAttendance">—</div>
        <div class="s-stat-label">Avg Attendance</div>
      </div>
      <div class="s-stat-card">
        <div class="s-stat-icon sub-icon">
          <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
        </div>
        <div class="s-stat-val" id="totalSubjects">—</div>
        <div class="s-stat-label">Enrolled Subjects</div>
      </div>
      <div class="s-stat-card">
        <div class="s-stat-icon gpa-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
        </div>
        <div class="s-stat-val" id="cgpaVal">—</div>
        <div class="s-stat-label">CGPA</div>
      </div>
      <div class="s-stat-card">
        <div class="s-stat-icon sec-icon">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        </div>
        <div class="s-stat-val" id="sectionVal">—</div>
        <div class="s-stat-label">Section</div>
      </div>
    </div>

    <!-- Attendance per subject -->
    <div class="card s-card" style="margin-bottom:1.25rem">
      <div class="s-card-title">Attendance Overview</div>
      <div id="attOverview"><div class="empty-state">Loading…</div></div>
    </div>

    <!-- Marks summary -->
    <div class="card s-card">
      <div class="s-card-title">Marks Summary</div>
      <div id="marksSummary"><div class="empty-state">Loading…</div></div>
    </div>

  </div>

  <script src="../js/student-dashboard.js"></script>
</body>
</html>
