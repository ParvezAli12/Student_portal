<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Students — SSUET Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/students-list.css">
</head>
<body>

  <!-- Mobile topbar -->
<div class="mobile-topbar">
  <div class="mobile-logo">SSUET <span>Portal</span></div>
  <button class="hamburger" id="hamburger">
    <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">
      <div class="logo-box">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <div>
        <div class="logo-name">SSUET Portal</div>
        <div class="logo-sub">Teacher Panel</div>
      </div>
    </div>

    <div class="teacher-pill">
      <div class="name" id="teacherName">—</div>
      <div class="emp"  id="teacherEmp">—</div>
    </div>

    <div class="nav-section">Main</div>
    <a class="nav-item" href="/pages/teacher-dashboard.html">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a class="nav-item" href="/pages/scanner.html">
      <svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
      QR Scanner
    </a>

    <div class="nav-section">Manage</div>
    <a class="nav-item" href="/pages/add-student.html">
      <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      Add Student
    </a>
    <a class="nav-item active" href="/pages/students-list.html">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
      Students
    </a>
    <a class="nav-item" href="/pages/marks-entry.html">
  <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
  Marks Entry
</a>
<a class="nav-item" href="/pages/result-card.html">
  <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
  Result Cards
</a>

    <div class="sidebar-footer">
      <button class="logout-btn" id="logoutBtn">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Logout
      </button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="topbar">
      <div>
        <div class="page-title">Students</div>
        <div class="page-sub" id="studentCount">Loading…</div>
      </div>
      <a href="/pages/add-student.html" class="add-btn">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Student
      </a>
    </div>

    <!-- FILTERS -->
    <div class="filters card">
      <div class="filter-group">
        <label>Search</label>
        <input type="text" id="searchInput" placeholder="Name or roll number…"/>
      </div>
      <div class="filter-group">
        <label>Batch</label>
        <select id="filterBatch">
          <option value="">All Batches</option>
          <option value="2023F">2023F</option>
          <option value="2023S">2023S</option>
          <option value="2022F">2022F</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Section</label>
        <select id="filterSection">
          <option value="">All Sections</option>
          <option value="SE-A">SE-A</option>
          <option value="SE-B">SE-B</option>
          <option value="SE-C">SE-C</option>
        </select>
      </div>
      <button class="clear-btn" id="clearFilters">Clear</button>
    </div>

    <!-- TABLE -->
    <div class="card table-card">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Student</th>
            <th>Roll Number</th>
            <th>Batch</th>
            <th>Section</th>
            <th>Subjects</th>
            <th>QR</th>
          </tr>
        </thead>
        <tbody id="studentsTable">
          <tr><td colspan="7" class="empty-state">Loading students…</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- QR MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Student QR Code</div>
        <button class="modal-close" id="modalClose">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <img id="modalQR" src="" alt="QR Code"/>
        <div class="modal-info">
          <div class="modal-name"    id="modalName">—</div>
          <div class="modal-roll"    id="modalRoll">—</div>
          <div class="modal-details" id="modalDetails">—</div>
        </div>
        <button class="print-btn" onclick="window.print()">
          <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Print QR Card
        </button>
      </div>
    </div>
  </div>

  <style>
    .teacher-pill { background: #253656 !important; border: 1px solid #344870 !important; }
    .teacher-pill .name { color: #FFFFFF !important; font-weight: 600 !important; }
    .teacher-pill .emp  { color: #A8BACE !important; }
  </style>

  <script src="../js/students-list.js"></script>
</body>
</html>
